<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<Directory /var/www/html/database>
    Require all denied
</Directory>

<Directory /var/www/html/config>
    Require all denied
</Directory>

<Directory /var/www/html/partials>
    Require all denied
</Directory>

<Directory /var/www/html/vendor>
    Require all denied
</Directory>

<Directory /var/www/html/uploads/ticket_attachments>
    AllowOverride None
    Require all denied
</Directory>

<FilesMatch "(?i)(^\.|\.md$|\.sql$|\.lock$|\.json$|\.phar$)">
    Require all denied
</FilesMatch>
